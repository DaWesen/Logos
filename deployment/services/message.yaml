apiVersion: apps/v1
kind: Deployment
metadata:
  name: message
  namespace: logos
  labels:
    app: message
    domain: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message
  template:
    metadata:
      labels:
        app: message
        domain: messaging
    spec:
      containers:
        - name: message
          image: logos:latest
          imagePullPolicy: IfNotPresent
          command: ["./message"]
          ports:
            - containerPort: 9009
          volumeMounts:
            - name: config
              mountPath: /app/config
          readinessProbe:
            tcpSocket:
              port: 9009
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: logos-config
---
apiVersion: v1
kind: Service
metadata:
  name: message-svc
  namespace: logos
spec:
  selector:
    app: message
  ports:
    - port: 9009
      targetPort: 9009

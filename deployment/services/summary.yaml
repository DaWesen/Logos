apiVersion: apps/v1
kind: Deployment
metadata:
  name: summary
  namespace: logos
  labels:
    app: summary
    domain: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summary
  template:
    metadata:
      labels:
        app: summary
        domain: ai
    spec:
      containers:
        - name: summary
          image: logos:latest
          imagePullPolicy: IfNotPresent
          command: ["./summary"]
          ports:
            - containerPort: 9017
          volumeMounts:
            - name: config
              mountPath: /app/config
          readinessProbe:
            tcpSocket:
              port: 9017
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: logos-config
---
apiVersion: v1
kind: Service
metadata:
  name: summary-svc
  namespace: logos
spec:
  selector:
    app: summary
  ports:
    - port: 9017
      targetPort: 9017

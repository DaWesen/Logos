apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: logos
  labels:
    app: gateway
    domain: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        domain: platform
    spec:
      containers:
        - name: gateway
          image: logos:latest
          imagePullPolicy: IfNotPresent
          command: ["./gateway"]
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /app/config
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: logos-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: logos
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      nodePort: 30080

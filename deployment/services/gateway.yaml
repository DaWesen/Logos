apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: logos
  labels:
    app: gateway
    domain: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        domain: platform
    spec:
      containers:
        - name: gateway
          image: logos:latest
          imagePullPolicy: IfNotPresent
          command: ["./gateway"]
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /app/config
          # 存活探针只证明进程还在：依赖挂了不该重启进程，
          # 否则数据库抖动会让所有副本一起重启，把故障放大成雪崩。
          livenessProbe:
            httpGet:
              path: /livez
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          # 就绪探针检查 MinIO 等依赖：不可用时摘流量，而不是继续接请求后超时。
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: logos-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: logos
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      nodePort: 30080

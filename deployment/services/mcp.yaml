apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: logos
  labels:
    app: mcp
    domain: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
        domain: ai
    spec:
      containers:
        - name: mcp
          image: logos:latest
          imagePullPolicy: IfNotPresent
          command: ["./mcp"]
          ports:
            - containerPort: 9018
          volumeMounts:
            - name: config
              mountPath: /app/config
          readinessProbe:
            tcpSocket:
              port: 9018
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: logos-config
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-svc
  namespace: logos
spec:
  selector:
    app: mcp
  ports:
    - port: 9018
      targetPort: 9018

apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommend
  namespace: logos
  labels:
    app: recommend
    domain: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommend
  template:
    metadata:
      labels:
        app: recommend
        domain: ai
    spec:
      containers:
        - name: recommend
          image: logos:latest
          imagePullPolicy: IfNotPresent
          command: ["./recommend"]
          ports:
            - containerPort: 9006
          volumeMounts:
            - name: config
              mountPath: /app/config
          readinessProbe:
            tcpSocket:
              port: 9006
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: logos-config
---
apiVersion: v1
kind: Service
metadata:
  name: recommend-svc
  namespace: logos
spec:
  selector:
    app: recommend
  ports:
    - port: 9006
      targetPort: 9006

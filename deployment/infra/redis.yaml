apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: logos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: docker.1ms.run/library/redis:latest
          ports:
            - containerPort: 6379
          command: ["redis-server", "--requirepass", "redis123456", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "redis123456", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: logos
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

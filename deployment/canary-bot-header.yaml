# Logos 服务金丝雀发布配置（基于 Header）
# 使用方式：kubectl apply -f canary-bot-header.yaml
#
# 测试方式：
#   90% 流量到 v1: curl http://localhost:80/...
#   特定用户到 v2: curl -H "x-canary: true" http://localhost:80/...

apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: bot
  namespace: logos
spec:
  hosts:
  - bot-svc
  http:
  - match:
    - headers:
        x-canary:
          exact: "true"
    route:
    - destination:
        host: bot-svc
        subset: v2
  - route:
    - destination:
        host: bot-svc
        subset: v1
      weight: 90
    - destination:
        host: bot-svc
        subset: v2
      weight: 10
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: bot
  namespace: logos
spec:
  host: bot-svc
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2

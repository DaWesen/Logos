# Logos - 水平自动扩缩容（HPA）配置
# 使用方式：kubectl apply -f hpa.yaml
#
# 自动扩缩容规则：
# - 基于 CPU 使用率（目标 60%）
# - 基于内存使用率（目标 70%）
# - 最少 2 个 Pod，最多 10 个 Pod
# - 每次扩缩容之间有冷却时间

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: logos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60  # 扩容前观察 60 秒
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60        # 每 60 秒最多增加 2 个 Pod
    scaleDown:
      stabilizationWindowSeconds: 300 # 缩容前观察 5 分钟
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60        # 每 60 秒最多减少 10% 的 Pod
---
# Bot 服务的 HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bot-hpa
  namespace: logos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bot
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
---

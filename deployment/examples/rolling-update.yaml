# Logos - K8s 滚动更新配置
# 使用方式：kubectl apply -f rolling-update.yaml
#
# 滚动更新策略：
# - maxSurge: 最多同时创建多少个新 Pod
# - maxUnavailable: 最多同时不可用多少个 Pod

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: logos
  labels:
    app: gateway
    domain: platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 最多同时创建 1 个新 Pod
      # 新副本必须通过就绪探针才会接流量。若允许 maxUnavailable=1，
      # 滚动期间会有 1 个旧副本先下线，而新副本可能仍在探测依赖；
      # 把不可用数压到 0，用 maxSurge 换容量，避免更新窗口出现容量缺口。
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        domain: platform
    spec:
      containers:
        - name: gateway
          image: logos:latest
          imagePullPolicy: IfNotPresent
          command: ["./gateway"]
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /app/config
          # 存活探针 - 只检查进程是否还活着，不查依赖
          livenessProbe:
            httpGet:
              path: /livez
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          # 就绪探针 - 依赖不可用时摘流量
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          # 启动探针 - 给应用启动时间；启动阶段只要求进程起来
          startupProbe:
            httpGet:
              path: /livez
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: logos-config

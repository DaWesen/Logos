# Logos - Prometheus 告警规则配置
# 使用方式：
# 1. 确保 Prometheus Operator 已安装
# 2. kubectl apply -f prometheus-rules.yaml

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: logos-alerts
  namespace: logos
  labels:
    app: prometheus
    release: prometheus
spec:
  groups:
  - name: logos.general
    interval: 30s
    rules:
    # Pod 不可用告警
    - alert: PodNotReady
      expr: |
        sum by (namespace, pod) (
          max_over_time(kube_pod_status_ready{namespace="logos", condition="true"}[5m]) == 0
        )
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} is not ready"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for more than 5 minutes"
    
    # Deployment 副本数不足告警
    - alert: DeploymentReplicasMismatch
      expr: |
        kube_deployment_spec_replicas{namespace="logos"} != kube_deployment_status_replicas_available{namespace="logos"}
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Deployment replicas mismatch for {{ $labels.deployment }}"
        description: "Deployment {{ $labels.deployment }} has {{ $value }} available replicas vs {{ $labels.kube_deployment_spec_replicas }} desired"

  - name: logos.service
    interval: 30s
    rules:
    # 高错误率告警
    - alert: HighErrorRate
      expr: |
        rate(http_requests_total{status=~"5..", namespace="logos"}[5m]) / rate(http_requests_total{namespace="logos"}[5m]) > 0.05
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High error rate for {{ $labels.service }}"
        description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"
    
    # 高延迟告警
    - alert: HighLatency
      expr: |
        histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="logos"}[5m])) by (le, service)) > 1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High latency for {{ $labels.service }}"
        description: "P99 latency is {{ $value }}s for {{ $labels.service }}"

  - name: logos.resources
    interval: 30s
    rules:
    # CPU 使用率高告警
    - alert: HighCPUUsage
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace="logos", container!="", pod!=""}[5m])) by (pod) / sum(kube_pod_container_resource_limits{namespace="logos", container!="", resource="cpu"}) by (pod) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage for {{ $labels.pod }}"
        description: "CPU usage is {{ $value | humanizePercentage }} for {{ $labels.pod }}"
    
    # 内存使用率高告警
    - alert: HighMemoryUsage
      expr: |
        sum(container_memory_working_set_bytes{namespace="logos", container!="", pod!=""}) by (pod) / sum(kube_pod_container_resource_limits{namespace="logos", container!="", resource="memory"}) by (pod) > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage for {{ $labels.pod }}"
        description: "Memory usage is {{ $value | humanizePercentage }} for {{ $labels.pod }}"

  - name: logos.k8s
    interval: 30s
    rules:
    # 节点 NotReady 告警
    - alert: NodeNotReady
      expr: kube_node_status_ready{condition="true"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.node }} is not ready"
        description: "Node {{ $labels.node }} has been not ready for more than 5 minutes"
    
    # 集群资源不足告警
    - alert: ClusterResourceLow
      expr: |
        sum(kube_pod_container_resource_requests{resource="cpu", namespace="logos"}) by (node) / sum(kube_node_status_allocatable{resource="cpu"}) by (node) > 0.75
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Cluster CPU resources low on node {{ $labels.node }}"
        description: "CPU request ratio is {{ $value | humanizePercentage }} on node {{ $labels.node }}"

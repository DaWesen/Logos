# Logos - Prometheus 告警规则配置
# 使用方式：
# 1. 确保 Prometheus Operator 已安装
# 2. kubectl apply -f prometheus-rules.yaml

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: logos-alerts
  namespace: logos
  labels:
    app: prometheus
    release: prometheus
spec:
  groups:
  - name: logos.general
    interval: 30s
    rules:
    # Pod 不可用告警
    - alert: PodNotReady
      expr: |
        sum by (namespace, pod) (
          max_over_time(kube_pod_status_ready{namespace="logos", condition="true"}[5m]) == 0
        )
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} is not ready"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for more than 5 minutes"
    
    # Deployment 副本数不足告警
    - alert: DeploymentReplicasMismatch
      expr: |
        kube_deployment_spec_replicas{namespace="logos"} != kube_deployment_status_replicas_available{namespace="logos"}
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Deployment replicas mismatch for {{ $labels.deployment }}"
        description: "Deployment {{ $labels.deployment }} has {{ $value }} available replicas vs {{ $labels.kube_deployment_spec_replicas }} desired"

  - name: logos.service
    interval: 30s
    rules:
    # 高错误率告警
    - alert: HighErrorRate
      expr: |
        rate(http_requests_total{status=~"5..", namespace="logos"}[5m]) / rate(http_requests_total{namespace="logos"}[5m]) > 0.05
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High error rate for {{ $labels.service }}"
        description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"
    
    # 高延迟告警
    - alert: HighLatency
      expr: |
        histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="logos"}[5m])) by (le, service)) > 1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High latency for {{ $labels.service }}"
        description: "P99 latency is {{ $value }}s for {{ $labels.service }}"

  # 可靠性链路：Kafka 消费 / Outbox 投递
  # 指标由 OTel Collector 的 prometheus exporter 转换，counter 带 _total 后缀
  - name: logos.reliability
    interval: 30s
    rules:
    # 出现毒丸消息：消息已转存 <topic>.dlq，需要人工排查并回放
    - alert: KafkaPoisonMessage
      expr: |
        sum by (topic) (increase(logos_kafka_poison_count_total[5m])) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Kafka 出现毒丸消息（topic={{ $labels.topic }}）"
        description: "5 分钟内 {{ $labels.topic }} 有消息连续处理失败并被转存死信队列，请检查 {{ $labels.topic }}.dlq 并人工回放"

    # 消费失败率过高：说明下游依赖（DB/Redis/下游服务）异常
    - alert: KafkaConsumeFailureRateHigh
      expr: |
        sum by (topic) (rate(logos_kafka_consume_count_total{result="failed"}[5m]))
          /
        sum by (topic) (rate(logos_kafka_consume_count_total[5m])) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Kafka 消费失败率高（topic={{ $labels.topic }}）"
        description: "{{ $labels.topic }} 近 5 分钟消费失败率 {{ $value | humanizePercentage }}，消息正在重投并可能阻塞分区"

    # Outbox 重试耗尽进入死信：域事件已停止投递
    - alert: OutboxDeadLetter
      expr: |
        sum by (topic) (increase(logos_outbox_deadletter_count_total[5m])) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Outbox 消息进入死信（topic={{ $labels.topic }}）"
        description: "{{ $labels.topic }} 的域事件已重试 5 次仍失败，需人工确认后调用 ReplayDeadLetters 重放"

    # Outbox 投递失败率过高：Kafka 抖动或 broker 不可用
    - alert: OutboxDispatchFailureRateHigh
      expr: |
        sum by (topic) (rate(logos_outbox_dispatch_count_total{result="failed"}[5m]))
          /
        sum by (topic) (rate(logos_outbox_dispatch_count_total[5m])) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Outbox 投递失败率高（topic={{ $labels.topic }}）"
        description: "{{ $labels.topic }} 近 5 分钟投递失败率 {{ $value | humanizePercentage }}，域事件投递延迟将持续增大"

    # LLM 结构化输出解析失败率过高：模型输出格式漂移，业务已降级为空结果（静默失败）
    - alert: LLMParseFailureRateHigh
      expr: |
        sum by (module) (rate(logos_llm_parse_count_total{result="failed"}[10m]))
          /
        sum by (module) (rate(logos_llm_parse_count_total[10m])) > 0.2
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "LLM 结构化输出解析失败率高（module={{ $labels.module }}）"
        description: "{{ $labels.module }} 近 10 分钟解析失败率 {{ $value | humanizePercentage }}，业务已降级为空结果，请检查 prompt 或模型输出格式"

    # Token 用量退化为本地估算的比例过高：上游未返回 usage，计费精度下降
    - alert: LLMTokenUsageEstimateRateHigh
      expr: |
        sum(rate(logos_llm_token_source_count_total{source="estimate"}[15m]))
          /
        sum(rate(logos_llm_token_source_count_total[15m])) > 0.2
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Token 用量估算占比过高"
        description: "近 15 分钟 {{ $value | humanizePercentage }} 的计费使用本地估算而非供应商真实 usage，请检查上游模型是否返回 usage（流式需 stream_options.include_usage）"

  # 支付链路：回调结果指标
  - name: logos.payment
    interval: 30s
    rules:
    # 回调失败率过高：可能是验签密钥不一致、渠道重复推送过期订单，或伪造回调攻击
    - alert: PaymentCallbackFailureRateHigh
      expr: |
        sum by (result) (rate(logos_payment_callback_count_total{result!="paid"}[10m])) > 0.1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "支付回调失败率过高（result={{ $labels.result }}）"
        description: "近 10 分钟每秒 {{ $value }} 次支付回调未成功入账，请检查 PAYMENT_CALLBACK_SECRET 与渠道配置；若 invalid_signature 突增需排查伪造回调"

  - name: logos.resources
    interval: 30s
    rules:
    # CPU 使用率高告警
    - alert: HighCPUUsage
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace="logos", container!="", pod!=""}[5m])) by (pod) / sum(kube_pod_container_resource_limits{namespace="logos", container!="", resource="cpu"}) by (pod) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage for {{ $labels.pod }}"
        description: "CPU usage is {{ $value | humanizePercentage }} for {{ $labels.pod }}"
    
    # 内存使用率高告警
    - alert: HighMemoryUsage
      expr: |
        sum(container_memory_working_set_bytes{namespace="logos", container!="", pod!=""}) by (pod) / sum(kube_pod_container_resource_limits{namespace="logos", container!="", resource="memory"}) by (pod) > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage for {{ $labels.pod }}"
        description: "Memory usage is {{ $value | humanizePercentage }} for {{ $labels.pod }}"

  - name: logos.k8s
    interval: 30s
    rules:
    # 节点 NotReady 告警
    - alert: NodeNotReady
      expr: kube_node_status_ready{condition="true"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.node }} is not ready"
        description: "Node {{ $labels.node }} has been not ready for more than 5 minutes"
    
    # 集群资源不足告警
    - alert: ClusterResourceLow
      expr: |
        sum(kube_pod_container_resource_requests{resource="cpu", namespace="logos"}) by (node) / sum(kube_node_status_allocatable{resource="cpu"}) by (node) > 0.75
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Cluster CPU resources low on node {{ $labels.node }}"
        description: "CPU request ratio is {{ $value | humanizePercentage }} on node {{ $labels.node }}"

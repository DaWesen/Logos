---
# Service（当前指向 v1，切换 v2 时修改 selector）
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: logos
spec:
  type: NodePort
  selector:
    app: gateway-v1  # 切换蓝绿时，这里改成 gateway-v2
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      nodePort: 30080

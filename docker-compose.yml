# Logos - AI-Powered Instant Messaging Platform
# Docker Compose 编排文件
# 架构: Platform / Messaging / AI 三大领域

x-service-discovery: &service-discovery
  LOGOS_USER_HOST: user-service
  LOGOS_CONTACT_HOST: contact-service
  LOGOS_CHAT_HOST: chat-service
  LOGOS_BOT_HOST: bot-service
  LOGOS_MODERATION_HOST: moderation-service
  LOGOS_SUMMARY_HOST: summary-service
  LOGOS_MCP_HOST: mcp-service
  LOGOS_PROCESS_HOST: process-service
  LOGOS_VECTOR_HOST: vector-service
  LOGOS_KNOWLEDGE_HOST: knowledge-service
  LOGOS_SEARCH_HOST: search-service
  LOGOS_EXTRACTION_HOST: extraction-service
  LOGOS_COLLECTION_HOST: collection-service
  LOGOS_QUESTION_HOST: question-service
  LOGOS_RECOMMEND_HOST: recommend-service
  LOGOS_MESSAGE_HOST: message-service
  LOGOS_IM_HOST: im-service
  LOGOS_BILLING_HOST: billing-service
  LOGOS_MONITORING_HOST: monitoring-service

x-tracing: &tracing
  TRACING_ENABLE: "true"
  OTEL_ENDPOINT: otel-collector:4317

services:
  # ==================== 基础设施层 ====================

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: logos-zookeeper
    ports:
      - "2182:2181"
    volumes:
      - zk-data:/data
    networks:
      - logos-network

  etcd:
    image: docker.1panel.live/bitnami/etcd:latest
    container_name: logos-etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/default.etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - logos-network

  postgres:
    image: docker.1ms.run/library/postgres:latest
    container_name: logos-postgres
    environment:
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - logos-network

  redis:
    image: docker.1ms.run/library/redis:latest
    container_name: logos-redis
    command: redis-server --requirepass redis123456 --maxmemory 256MB --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - logos-network

  minio:
    image: docker.1panel.live/minio/minio:latest
    container_name: logos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9901:9001"
    volumes:
      - minio-data:/data
    networks:
      - logos-network

  milvus:
    image: milvusdb/milvus:latest
    container_name: logos-milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    shm_size: 2gb
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin123
      MILVUS_GAUGE_PROMETHEUS_ENABLED: "false"
      COMMON_GRACEFULTIME: "5"
      QUOTAANDLIMITS_FLUSHRATE_ENABLED: "false"
      QUOTAANDLIMITS_DDL_ENABLED: "false"
      QUOTAANDLIMITS_INDEXRATE_ENABLED: "false"
      QUOTAANDLIMITS_COMPACTIONRATE_ENABLED: "false"
      QUOTAANDLIMITS_DML_ENABLED: "false"
      QUOTAANDLIMITS_DQL_ENABLED: "false"
      QUOTAANDLIMITS_LIMITS_MAXINSERTSIZE: "-1"
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus 
    depends_on:
      - etcd
      - minio
    networks:
      - logos-network

  kafka:
    image: wurstmeister/kafka:latest
    container_name: logos-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INSIDE://:9092,OUTSIDE://:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 7
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    ports:
      - "9093:9093"
    volumes:
      - kafka-data:/kafka
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logos-network

  elasticsearch:
    image: docker.m.daocloud.io/elasticsearch:8.19.5
    container_name: logos-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=logos-es
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - logos-network

  neo4j:
    image: docker.1ms.run/neo4j:latest
    container_name: logos-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j123456
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "512m"
      NEO4J_dbms_security_auth__enabled: "false"
      NEO4J_dbms_memory_pagecache_size: "256m"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - logos-network

  # ==================== 可观测性 ====================

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: logos-otel-collector
    command: ["--config=/etc/otelcol-config.yaml"]
    volumes:
      - ./config/otelcol-config.yaml:/etc/otelcol-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8890:8889"
    depends_on:
      - jaeger
    networks:
      - logos-network

  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v2.47.2
    container_name: logos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - logos-network

  grafana:
    image: docker.m.daocloud.io/grafana/grafana-enterprise:latest
    container_name: logos-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/dashboards/dashboard_providers.yaml:/etc/grafana/provisioning/dashboards/dashboard_providers.yaml
      - ./config/grafana/dashboards/aim_overview.json:/var/lib/grafana/dashboards/aim_overview.json
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/aim_overview.json
    depends_on:
      - prometheus
    networks:
      - logos-network

  kiali:
    image: m.daocloud.io/quay.io/kiali/kiali:latest
    container_name: logos-kiali
    ports:
      - "20001:20001"
    environment:
      - PROMETHEUS_SERVICE_URL=http://prometheus:9090
      - SERVER_CREDENTIALS_SESSION_SECRET_KEY=logos1234567890ab
    depends_on:
      - prometheus
    networks:
      - logos-network

  nginx:
    image: docker.1ms.run/library/nginx:latest
    container_name: logos-nginx
    ports:
      - "80:80"
    volumes:
      - nginx-logs:/var/log/nginx
    networks:
      - logos-network

  jaeger:
    image: docker.m.daocloud.io/jaegertracing/all-in-one:1.58
    container_name: logos-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - logos-network

  # ==================== Platform 领域 ====================
  # 网关 / 用户 / 监控 / 计费 — 平台基础设施

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-gateway
    environment:
      GIN_MODE: release
      SERVICE_HOST: gateway
      ETCD_ENDPOINTS: etcd:2379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: your-secret-key-change-in-production-please-use-strong-random-string
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      PROCESS_SERVICE_HOST: process-service
      LOGOS_USER_HOST: user-service
      LOGOS_KNOWLEDGE_HOST: knowledge-service
      LOGOS_SEARCH_HOST: search-service
      LOGOS_VECTOR_HOST: vector-service
      LOGOS_QUESTION_HOST: question-service
      LOGOS_RECOMMEND_HOST: recommend-service
      LOGOS_EXTRACTION_HOST: extraction-service
      LOGOS_COLLECTION_HOST: collection-service
      LOGOS_MESSAGE_HOST: message-service
      LOGOS_MONITORING_HOST: monitoring-service
      LOGOS_BOT_HOST: bot-service
      LOGOS_BILLING_HOST: billing-service
      LOGOS_IM_HOST: im-service
      LOGOS_CHAT_HOST: chat-service
      LOGOS_CONTACT_HOST: contact-service
      LOGOS_SUMMARY_HOST: summary-service
      LOGOS_MCP_HOST: mcp-service
      LOGOS_MODERATION_HOST: moderation-service
    ports:
      - "8888:8888"
    depends_on:
      - etcd
      - postgres
      - redis
    networks:
      - logos-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-user
    command: ["./user"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: user-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - etcd
      - postgres
      - redis
    networks:
      - logos-network

  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-monitoring
    command: ["./monitoring"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: monitoring-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - postgres
      - redis
    networks:
      - logos-network

  billing-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-billing
    command: ["./billing"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: billing-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - postgres
      - redis
    networks:
      - logos-network

  # ==================== Messaging 领域 ====================
  # IM / Chat / Contact / Message — 即时通讯核心

  im-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-im
    command: ["./im"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: im-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - redis
    networks:
      - logos-network

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-chat
    command: ["./chat"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: chat-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - postgres
      - kafka
      - redis
    networks:
      - logos-network

  contact-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-contact
    command: ["./contact"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: contact-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - postgres
      - redis
    networks:
      - logos-network

  message-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-message
    command: ["./message"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: message-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - kafka
      - redis
    networks:
      - logos-network

  qqbridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-qqbridge
    command: ["./qqbridge"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: qqbridge
      ETCD_ENDPOINTS: etcd:2379
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
      QQBRIDGE_ENABLED: "true"
      QQBRIDGE_WS_PORT: "6701"
    ports:
      - "6701:6701"
    depends_on:
      - kafka
      - redis
    networks:
      - logos-network

  # ==================== AI 领域 ====================
  # 知识库 / 搜索 / 向量 / 问答 / 推荐 / 提取 / 集合 / Bot / Process — AI 能力

  knowledge-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-knowledge
    command: ["./knowledge"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: knowledge-service
      ETCD_ENDPOINTS: etcd:2379
      KAFKA_BROKERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: neo4j123456
      ES_ADDRESSES: http://elasticsearch:9200
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - neo4j
      - elasticsearch
      - redis
    networks:
      - logos-network

  search-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-search
    command: ["./search"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: search-service
      ETCD_ENDPOINTS: etcd:2379
      KAFKA_BROKERS: kafka:9092
      ES_ADDRESSES: http://elasticsearch:9200
    depends_on:
      - etcd
      - elasticsearch
    networks:
      - logos-network

  vector-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-vector
    command: ["./vector"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: vector-service
      ETCD_ENDPOINTS: etcd:2379
      KAFKA_BROKERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
      MILVUS_ADDRESS: milvus:19530
      ARK_API_KEY: your-ark-api-key
      ARK_MODEL: ep-20240806150409-xxxxx
      EMBEDDING_MODEL: embedding-3
    depends_on:
      - etcd
      - postgres
      - redis
      - milvus
    networks:
      - logos-network

  question-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-question
    command: ["./question"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: question-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      KAFKA_BROKERS: kafka:9092
      MILVUS_ADDRESS: milvus:19530
      ARK_API_KEY: your-ark-api-key
      ARK_MODEL: ep-20240806150409-xxxxx
      EMBEDDING_MODEL: embedding-3
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - milvus
      - redis
    networks:
      - logos-network

  recommend-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-recommend
    command: ["./recommend"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: recommend-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - postgres
      - redis
    networks:
      - logos-network

  extraction-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-extraction
    command: ["./extraction"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: extraction-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      ARK_API_KEY: your-ark-api-key
      ARK_MODEL: ep-20240806150409-xxxxx
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - kafka
      - redis
    networks:
      - logos-network

  collection-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-collection
    command: ["./collection"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: collection-service
      ETCD_ENDPOINTS: etcd:2379
      KAFKA_BROKERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      ES_ADDRESSES: http://elasticsearch:9200
    depends_on:
      - etcd
      - kafka
      - postgres
      - elasticsearch
    networks:
      - logos-network

  bot-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-bot
    command: ["./bot"]
    environment:
      <<: [*service-discovery, *tracing]
      SERVICE_HOST: bot-service
      ETCD_ENDPOINTS: etcd:2379
      KAFKA_BROKERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      ARK_API_KEY: your-ark-api-key
      ARK_MODEL: ep-20240806150409-xxxxx
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - etcd
      - postgres
      - redis
    networks:
      - logos-network

  process-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-process
    command: ["./process"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: process-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos123456
      POSTGRES_DB: logos
      ARK_API_KEY: your-ark-api-key
      ARK_MODEL: ep-20240806150409-xxxxx
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: logos-documents
    ports:
      - "9016:9016"
    depends_on:
      - etcd
      - postgres
      - minio
    networks:
      - logos-network

  summary-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-summary
    command: ["./summary"]
    environment:
      <<: *service-discovery
      SERVICE_HOST: summary-service
      ETCD_ENDPOINTS: etcd:2379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

# Logos Gateway 负载均衡配置（多节点水平扩展）
#
# 设计要点：
# 1. 运行时 DNS 解析（本文件的关键点）
#    resolver 指向 docker 内置 DNS(127.0.0.11)，valid=10s 控制缓存窗口。
#    但 resolver 只对「proxy_pass 里带变量」的写法生效 —— upstream 块中的
#    server 名只在 nginx 启动时解析一次。因此这里刻意不用 upstream 块，
#    而是 set $gw + proxy_pass http://$gw，强制每次请求走运行时解析。
#    效果：docker compose --scale gateway=N 扩缩容后 10s 内自动生效，无需 reload nginx。
# 2. 代价：变量式 proxy_pass 会绕过 upstream 块，因此无法使用 least_conn
#    与 max_fails 被动健康检查，退化为 DNS 轮询分摊新连接。
#    WebSocket 是长连接，分摊只发生在连接建立那一刻，轮询效果与 least_conn 接近；
#    容器宕机则由 docker DNS 在 valid 窗口内摘除 A 记录实现 ~10s 自愈。
# 3. 不使用 ip_hash：WebSocket 跨节点投递已由 Redis PubSub 解决，无需 sticky session
# 4. /ws：标准 WebSocket 升级 + 长超时(3600s)，避免心跳间隔触发 nginx 断连
# 5. /healthz：反代到 gateway /health，作为 nginx 自身 healthcheck 入口

worker_processes auto;
events {
    worker_connections 10240;
}

http {
    # docker 内置 DNS：gateway 多副本的 A 记录由此解析，valid=10s 控制重解析间隔
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # 用变量承载 upstream，使 resolver 在运行时生效（见设计要点 1）
        set $gw gateway:8888;

        # 健康检查端点（nginx 自身），反代到 gateway 的 /health
        location /healthz {
            proxy_pass http://$gw/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # WebSocket 入口
        location /ws {
            proxy_pass http://$gw;
            proxy_http_version 1.1;
            # 标准 WebSocket 升级 header
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WS 长连接超时，避免心跳间隔触发 nginx 关闭
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # 关闭缓冲，消息立即推送
            proxy_buffering off;
        }

        # 普通 HTTP API
        location / {
            proxy_pass http://$gw;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
syntax = "proto3";

package chat;

option go_package = "Logos/proto_gen/chat";

import "common.proto";

enum MessageType {
  TEXT = 0;
  IMAGE = 1;
  FILE = 2;
  SYSTEM = 3;
}

message ChatMessage {
  string id = 1;
  int64 sender_id = 2;
  optional int64 receiver_id = 3;
  optional int64 group_id = 4;
  MessageType type = 5;
  string content = 6;
  int64 created_at = 7;
  optional bool read = 8;
}

message SendMessageReq {
  int64 sender_id = 1;
  optional int64 receiver_id = 2;
  optional int64 group_id = 3;
  MessageType type = 4;
  string content = 5;
}

message SendMessageResp {
  common.BaseResp base_resp = 1;
  ChatMessage message = 2;
}

message GetHistoryReq {
  int64 user_id = 1;
  optional int64 receiver_id = 2;
  optional int64 group_id = 3;
  int64 before_time = 4;
  int32 limit = 5;
}

message HistoryResp {
  common.BaseResp base_resp = 1;
  repeated ChatMessage messages = 2;
  bool has_more = 3;
}

message MarkReadReq {
  int64 user_id = 1;
  repeated string message_ids = 2;
}

message CreateGroupReq {
  int64 creator_id = 1;
  string name = 2;
  repeated int64 member_ids = 3;
}

message GroupResp {
  common.BaseResp base_resp = 1;
  int64 group_id = 2;
  string name = 3;
  repeated int64 member_ids = 4;
}

message GroupMemberReq {
  int64 group_id = 1;
  int64 user_id = 2;
}

service ChatService {
  rpc SendMessage(SendMessageReq) returns (SendMessageResp);
  rpc GetMessageHistory(GetHistoryReq) returns (HistoryResp);
  rpc MarkMessagesRead(MarkReadReq) returns (common.BaseResp);
  rpc CreateGroup(CreateGroupReq) returns (GroupResp);
  rpc JoinGroup(GroupMemberReq) returns (common.BaseResp);
  rpc LeaveGroup(GroupMemberReq) returns (common.BaseResp);
}

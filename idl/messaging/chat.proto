syntax = "proto3";

package messaging.chat;

option go_package = "Logos/proto_gen/chat";

import "google/protobuf/timestamp.proto";

// 消息类型枚举
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_TEXT = 1;
  MESSAGE_TYPE_IMAGE = 2;
  MESSAGE_TYPE_FILE = 3;
  MESSAGE_TYPE_VOICE = 4;
  MESSAGE_TYPE_SYSTEM = 5;
}

// 聊天类型
enum ChatType {
  CHAT_TYPE_UNSPECIFIED = 0;
  CHAT_TYPE_PRIVATE = 1;
  CHAT_TYPE_GROUP = 2;
  CHAT_TYPE_BROADCAST = 3;
}

// 消息状态
enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_SENT = 1;
  MESSAGE_STATUS_DELIVERED = 2;
  MESSAGE_STATUS_READ = 3;
  MESSAGE_STATUS_WITHDRAWN = 4;
  MESSAGE_STATUS_EDITED = 5;
}

// 成员角色
enum GroupMemberRole {
  GROUP_MEMBER_ROLE_UNSPECIFIED = 0;
  GROUP_MEMBER_ROLE_OWNER = 1;
  GROUP_MEMBER_ROLE_ADMIN = 2;
  GROUP_MEMBER_ROLE_MEMBER = 3;
  GROUP_MEMBER_ROLE_BOT = 4;
}

// 禁言类型
enum MuteType {
  MUTE_TYPE_UNSPECIFIED = 0;
  MUTE_TYPE_NONE = 1;
  MUTE_TYPE_TEMPORARY = 2;
  MUTE_TYPE_PERMANENT = 3;
}

// 消息
message Message {
  string id = 1;
  string chat_id = 2;
  ChatType chat_type = 3;
  string sender_id = 4;
  MessageType message_type = 5;
  string content = 6;
  map<string, string> metadata = 7;
  MessageStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string reply_to_message_id = 11;
  repeated string mention_user_ids = 12;
  string media_url = 13;
  string media_meta = 14;
  // seq 会话内单调递增序号，作为客户端增量补拉的游标（仅历史接口返回时有效）。
  int64 seq = 15;
  // version 编辑版本号，初始为 0，每次成功编辑 +1。
  // 客户端编辑消息时必须把该值原样回传，服务端据此做乐观锁校验；
  // 版本不一致说明内容已被其他端修改，服务端返回 409 让客户端刷新后再提交。
  int64 version = 16;
}

// 群组
message Group {
  string id = 1;
  string name = 2;
  string avatar = 10;
  string owner_id = 3;
  repeated string member_ids = 4;
  map<string, string> metadata = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string announcement = 8;
  int32 member_count = 9;
}

// 群组成员
message GroupMember {
  string user_id = 1;
  GroupMemberRole role = 2;
  MuteType mute_type = 3;
  google.protobuf.Timestamp mute_until = 4;
  google.protobuf.Timestamp joined_at = 5;
}

// 发送消息请求
message SendMessageRequest {
  string chat_id = 1;
  ChatType chat_type = 2;
  MessageType message_type = 3;
  string content = 4;
  map<string, string> metadata = 5;
  string reply_to_message_id = 6;
  repeated string mention_user_ids = 7;
  // 客户端幂等键：同一发送者重复提交同一 request_id 只会产生一条消息，
  // 重试（超时、代理重放、双击）时服务端回放首次结果。为空则不做幂等。
  string request_id = 8;
}

// 发送消息响应
message SendMessageResponse {
  int32 code = 1;
  string message = 2;
  Message data = 3;
  // true 表示本次为幂等回放（该 request_id 已处理过），调用方不应再触发一次推送
  bool replayed = 4;
}

// 搜索消息请求
message SearchMessagesRequest {
  string chat_id = 1;
  ChatType chat_type = 2;
  string keyword = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  int32 page = 6;
  int32 page_size = 7;
}

// 搜索消息响应
message SearchMessagesResponse {
  int32 code = 1;
  string message = 2;
  repeated Message messages = 3;
  int32 total = 4;
}

// 获取消息历史请求
message GetMessageHistoryRequest {
  string chat_id = 1;
  ChatType chat_type = 2;
  google.protobuf.Timestamp before_time = 3;
  int32 limit = 4;
  // after_seq 会话内游标：> 0 时返回 seq 大于该值的消息（升序），用于断线重连后补齐实时推送缺口；
  // = 0 时保持原有语义（按 before_time 取最近 limit 条）。
  int64 after_seq = 5;
}

// 获取消息历史响应
message GetMessageHistoryResponse {
  int32 code = 1;
  string message = 2;
  repeated Message messages = 3;
  bool has_more = 4;
}

// 标记消息已读请求
message MarkMessagesReadRequest {
  string chat_id = 1;
  ChatType chat_type = 2;
  repeated string message_ids = 3;
}

// 标记消息已读响应
message MarkMessagesReadResponse {
  int32 code = 1;
  string message = 2;
}

// 撤回消息请求
message WithdrawMessageRequest {
  string message_id = 1;
}

// 撤回消息响应
message WithdrawMessageResponse {
  int32 code = 1;
  string message = 2;
}

// 删除消息请求（仅对请求者本人隐藏，不撤回、不影响其他成员）
message DeleteMessageRequest {
  string message_id = 1;
}

// 删除消息响应；重复删除同样返回成功（幂等）
message DeleteMessageResponse {
  int32 code = 1;
  string message = 2;
}

// 编辑消息请求
message EditMessageRequest {
  string message_id = 1;
  string content = 2;
  // version 客户端当前持有该消息的版本（来自 Message.version）。
  // 与服务端版本不一致时拒绝写入并返回 409，防止并发编辑互相覆盖。
  int64 version = 3;
}

// 编辑消息响应
message EditMessageResponse {
  int32 code = 1;
  string message = 2;
  Message data = 3;
}

// 创建群组请求
message CreateGroupRequest {
  string name = 1;
  repeated string member_ids = 2;
  map<string, string> metadata = 3;
}

// 创建群组响应
message CreateGroupResponse {
  int32 code = 1;
  string message = 2;
  Group data = 3;
}

// 邀请成员请求
message InviteGroupMemberRequest {
  string group_id = 1;
  repeated string user_ids = 2;
}

// 邀请成员响应
message InviteGroupMemberResponse {
  int32 code = 1;
  string message = 2;
}

// 踢出成员请求
message KickGroupMemberRequest {
  string group_id = 1;
  string user_id = 2;
}

// 踢出成员响应
message KickGroupMemberResponse {
  int32 code = 1;
  string message = 2;
}

// 禁言/解禁成员请求
message MuteGroupMemberRequest {
  string group_id = 1;
  string user_id = 2;
  MuteType mute_type = 3;
  google.protobuf.Timestamp mute_until = 4;
}

// 禁言/解禁成员响应
message MuteGroupMemberResponse {
  int32 code = 1;
  string message = 2;
}

// 转让群主请求
message TransferGroupOwnerRequest {
  string group_id = 1;
  string new_owner_id = 2;
}

// 转让群主响应
message TransferGroupOwnerResponse {
  int32 code = 1;
  string message = 2;
}

// 更新群公告请求
message UpdateGroupAnnouncementRequest {
  string group_id = 1;
  string announcement = 2;
}

// 更新群公告响应
message UpdateGroupAnnouncementResponse {
  int32 code = 1;
  string message = 2;
}

// 设置管理员请求
message SetGroupAdminRequest {
  string group_id = 1;
  string user_id = 2;
  bool is_admin = 3;
}

// 设置管理员响应
message SetGroupAdminResponse {
  int32 code = 1;
  string message = 2;
}

// 获取群成员列表请求
message GetGroupMembersRequest {
  string group_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// 获取群成员列表响应
message GetGroupMembersResponse {
  int32 code = 1;
  string message = 2;
  repeated GroupMember members = 3;
  int32 total = 4;
}

// 加入群组请求
message JoinGroupRequest {
  string group_id = 1;
}

// 加入群组响应
message JoinGroupResponse {
  int32 code = 1;
  string message = 2;
}

// 退出群组请求
message LeaveGroupRequest {
  string group_id = 1;
}

// 退出群组响应
message LeaveGroupResponse {
  int32 code = 1;
  string message = 2;
}

// 获取群组信息请求
message GetGroupRequest {
  string group_id = 1;
}

// 获取群组信息响应
message GetGroupResponse {
  int32 code = 1;
  string message = 2;
  Group data = 3;
}

// 会话项
message ConversationItem {
  string chat_id = 1;
  ChatType chat_type = 2;
  string name = 3;
  string avatar = 4;
  Message last_message = 5;
  int32 unread_count = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool is_pinned = 8;
  bool is_muted = 9;
  bool is_friend = 10;
  bool is_blocked = 11;
}

// 获取会话列表请求
message GetConversationListRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// 获取会话列表响应
message GetConversationListResponse {
  int32 code = 1;
  string message = 2;
  repeated ConversationItem conversations = 3;
  int32 total = 4;
}

// 获取未读消息数请求
message GetUnreadCountRequest {
  repeated string chat_ids = 1;
}

// 单个会话未读数
message ChatUnreadCount {
  string chat_id = 1;
  int32 count = 2;
}

// 获取未读消息数响应
message GetUnreadCountResponse {
  int32 code = 1;
  string message = 2;
  repeated ChatUnreadCount counts = 3;
  int32 total = 4;
}

// 消息已读回执
// 不存储「消息 × 成员」的逐条已读记录，而是复用会话已读位点 last_read_seq：
// 发送者查询时用一次位点比对反查出多少成员已读到该消息 seq，消息写入路径零额外写入。
message MessageReadReceipt {
  string message_id = 1;
  int64 seq = 2;
  // 已读人数（不含消息发送者）
  int32 read_count = 3;
  // 会话内当前可读成员数（不含消息发送者），用于展示「N/M 已读」
  int32 member_count = 4;
  bool all_read = 5;
  // 已读成员明细：默认不返回，避免窥探他人阅读行为
  repeated string reader_ids = 6;
}

// 获取消息已读回执请求
message GetMessageReadReceiptsRequest {
  string chat_id = 1;
  ChatType chat_type = 2;
  // 一次最多 50 条，仅返回请求者本人发送的消息
  repeated string message_ids = 3;
  // 是否返回已读成员明细（仅成员数不超过阈值时生效）
  bool include_readers = 4;
}

// 获取消息已读回执响应
message GetMessageReadReceiptsResponse {
  int32 code = 1;
  string message = 2;
  repeated MessageReadReceipt receipts = 3;
}

// 离线同步游标：客户端为每个会话维护三个互相独立的游标
//   - last_seq：已见过的最大消息 seq（表达「新增」）
//   - deleted_seq：已见过的最大删除墓碑序号（表达「删除」，因为被删的可能是很旧的消息）
//   - updated_seq：已见过的最大原位变更序号（表达「编辑/撤回」，同样可能作用于很旧的消息）
message ChatSyncCursor {
  string chat_id = 1;
  int64 last_seq = 2;
  int64 deleted_seq = 3;
  // updated_seq 原位变更（编辑/撤回）游标。这些变更不改变消息 seq，
  // 若只按 last_seq 补拉，离线期间被改写的旧消息会一直是旧内容。
  int64 updated_seq = 4;
}

// 原位变更（编辑/撤回）：消息 seq 不变，内容被改写，因此单独用 updated_seq 游标补拉。
message MessageChange {
  string message_id = 1;
  string chat_id = 2;
  // edit / withdraw
  string change_type = 3;
  // 变更后的内容；撤回为占位文本
  string content = 4;
  // 变更后的消息版本，客户端只在 version 比本地新时应用（乱序/重复不会回退内容）
  int64 version = 5;
  // 被变更消息的会话内 seq，用于跳过本人已清空的历史
  int64 message_seq = 6;
  // 变更日志自增 ID，即 updated_seq
  int64 updated_seq = 7;
  int64 changed_at = 8;
}

// 单个会话的增量同步结果
message ChatSyncResult {
  string chat_id = 1;
  // 按 seq 升序的增量消息
  repeated Message messages = 2;
  // 会话当前最大 seq，客户端应以此推进游标（即使本次没有消息）
  int64 latest_seq = 3;
  // 本人清空历史的水位线：<= 该 seq 的本地缓存应被丢弃，避免被重新拉回
  int64 cleared_seq = 4;
  // 本次是否还有更多（客户端可继续用返回的最大 seq 再次拉取）
  bool has_more = 5;
  // 自 deleted_seq 以来被本人删除的消息 ID，客户端应移除对应本地副本
  repeated string deleted_message_ids = 6;
  // 客户端应写回的新删除游标；本次无墓碑时回显入参
  int64 deleted_seq = 7;
  // 删除墓碑还有更多，客户端可用返回的 deleted_seq 继续拉取
  bool deleted_has_more = 8;
  // 自 updated_seq 以来的原位变更（编辑/撤回），客户端按 version 幂等应用
  repeated MessageChange changes = 9;
  // 客户端应写回的新变更游标；本次无变更时回显入参
  int64 updated_seq = 10;
  // 变更日志还有更多，客户端可用返回的 updated_seq 继续拉取
  bool updated_has_more = 11;
}

message SyncOfflineMessagesRequest {
  // 一次最多 100 个会话
  repeated ChatSyncCursor cursors = 1;
  // 每个会话返回的消息上限，默认 50，最大 200
  int32 limit = 2;
}

message SyncOfflineMessagesResponse {
  int32 code = 1;
  string message = 2;
  repeated ChatSyncResult chats = 3;
}

// 转发消息请求
message ForwardMessageRequest {
  string message_id = 1;
  repeated string target_chat_ids = 2;
  ChatType target_chat_type = 3;
}

// 转发消息响应
message ForwardMessageResponse {
  int32 code = 1;
  string message = 2;
  repeated Message forwarded_messages = 3;
}

// 删除聊天请求
message DeleteChatRequest {
  string chat_id = 1;
  ChatType chat_type = 2;
}

// 删除聊天响应
message DeleteChatResponse {
  int32 code = 1;
  string message = 2;
}

// 清理聊天记录请求
message DeleteChatHistoryRequest {
  string chat_id = 1;
}

// 清理聊天记录响应
message DeleteChatHistoryResponse {
  int32 code = 1;
  string message = 2;
}

// 更新群头像请求
message UpdateGroupAvatarRequest {
  string group_id = 1;
  string avatar = 2;
}

// 更新群头像响应
message UpdateGroupAvatarResponse {
  int32 code = 1;
  string message = 2;
}

// 聊天服务
service ChatService {
  // 发送消息
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  
  // 搜索消息
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  
  // 获取消息历史
  rpc GetMessageHistory(GetMessageHistoryRequest) returns (GetMessageHistoryResponse);
  
  // 标记消息已读
  rpc MarkMessagesRead(MarkMessagesReadRequest) returns (MarkMessagesReadResponse);
  
  // 撤回消息
  rpc WithdrawMessage(WithdrawMessageRequest) returns (WithdrawMessageResponse);
  
  // 删除消息（仅对本人生效）
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  
  // 编辑消息
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  
  // 创建群组
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  
  // 邀请成员
  rpc InviteGroupMember(InviteGroupMemberRequest) returns (InviteGroupMemberResponse);
  
  // 踢出成员
  rpc KickGroupMember(KickGroupMemberRequest) returns (KickGroupMemberResponse);
  
  // 禁言/解禁成员
  rpc MuteGroupMember(MuteGroupMemberRequest) returns (MuteGroupMemberResponse);
  
  // 转让群主
  rpc TransferGroupOwner(TransferGroupOwnerRequest) returns (TransferGroupOwnerResponse);
  
  // 更新群公告
  rpc UpdateGroupAnnouncement(UpdateGroupAnnouncementRequest) returns (UpdateGroupAnnouncementResponse);
  
  // 设置管理员
  rpc SetGroupAdmin(SetGroupAdminRequest) returns (SetGroupAdminResponse);
  
  // 获取群成员列表
  rpc GetGroupMembers(GetGroupMembersRequest) returns (GetGroupMembersResponse);
  
  // 加入群组
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);
  
  // 退出群组
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
  
  // 获取群组信息
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  
  // 获取会话列表
  rpc GetConversationList(GetConversationListRequest) returns (GetConversationListResponse);
  
  // 获取未读消息数
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);

  // 获取消息已读回执（发送者视角的已读人数）
  rpc GetMessageReadReceipts(GetMessageReadReceiptsRequest) returns (GetMessageReadReceiptsResponse);

  // 离线/断线重连后的批量增量同步（一次请求补齐多个会话）
  rpc SyncOfflineMessages(SyncOfflineMessagesRequest) returns (SyncOfflineMessagesResponse);
  
  // 转发消息
  rpc ForwardMessage(ForwardMessageRequest) returns (ForwardMessageResponse);
  
  // 删除聊天
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
  
  // 清理聊天记录
  rpc DeleteChatHistory(DeleteChatHistoryRequest) returns (DeleteChatHistoryResponse);

  // 更新群头像
  rpc UpdateGroupAvatar(UpdateGroupAvatarRequest) returns (UpdateGroupAvatarResponse);
}

syntax = "proto3";

package platform.billing;

option go_package = "Logos/proto_gen/billing";

import "google/protobuf/timestamp.proto";

// 交易类型
enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_DEPOSIT = 1;
  TRANSACTION_TYPE_WITHDRAWAL = 2;
  TRANSACTION_TYPE_CONSUME = 3;
  TRANSACTION_TYPE_REFUND = 4;
}

// 交易状态
enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_SUCCESS = 2;
  TRANSACTION_STATUS_FAILED = 3;
}

// 计费项目
enum BillingItem {
  BILLING_ITEM_UNSPECIFIED = 0;
  BILLING_ITEM_MODEL_CALL = 1;
  BILLING_ITEM_STORAGE = 2;
  BILLING_ITEM_BANDWIDTH = 3;
  BILLING_ITEM_EMBEDDING = 4;
}

// 账户
message Account {
  string id = 1;
  string user_id = 2;
  double balance = 3;
  double credit_limit = 4;
  map<string, double> usage = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// 交易记录
message Transaction {
  string id = 1;
  string user_id = 2;
  string account_id = 3;
  TransactionType type = 4;
  BillingItem item = 5;
  double amount = 6;
  double balance_before = 7;
  double balance_after = 8;
  string description = 9;
  TransactionStatus status = 10;
  map<string, string> metadata = 11;
  google.protobuf.Timestamp created_at = 12;
}

// 充值请求
message DepositRequest {
  string user_id = 1;
  double amount = 2;
  string payment_method = 3;
  map<string, string> metadata = 4;
}

// 充值响应
message DepositResponse {
  int32 code = 1;
  string message = 2;
  Transaction data = 3;
}

// 获取账户请求
message GetAccountRequest {
  string user_id = 1;
}

// 获取账户响应
message GetAccountResponse {
  int32 code = 1;
  string message = 2;
  Account data = 3;
}

// 获取交易记录请求
message GetTransactionsRequest {
  string user_id = 1;
  TransactionType type = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  int32 page = 5;
  int32 page_size = 6;
}

// 获取交易记录响应
message GetTransactionsResponse {
  int32 code = 1;
  string message = 2;
  repeated Transaction transactions = 3;
  int32 total = 4;
}

// 获取用量统计请求
message GetUsageStatsRequest {
  string user_id = 1;
  BillingItem item = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
}

// 获取用量统计响应
message GetUsageStatsResponse {
  int32 code = 1;
  string message = 2;
  map<string, double> stats = 3;
}

// 模型调用计费请求
message ConsumeModelCallRequest {
  string user_id = 1;
  string provider = 2;
  string model_name = 3;
  int32 token_count = 4;
  map<string, string> metadata = 5;
}

// 模型调用计费响应
message ConsumeModelCallResponse {
  int32 code = 1;
  string message = 2;
  double amount = 3;
}

// 提现请求
message WithdrawRequest {
  string user_id = 1;
  double amount = 2;
  string withdraw_method = 3;
  map<string, string> metadata = 4;
}

// 提现响应
message WithdrawResponse {
  int32 code = 1;
  string message = 2;
  Transaction data = 3;
}

// 退款请求
message RefundRequest {
  string user_id = 1;
  string transaction_id = 2;
  double amount = 3;
  string reason = 4;
  map<string, string> metadata = 5;
}

// 退款响应
message RefundResponse {
  int32 code = 1;
  string message = 2;
  Transaction data = 3;
}

// 嵌入计费请求
message ConsumeEmbeddingRequest {
  string user_id = 1;
  string provider = 2;
  string model_name = 3;
  int32 token_count = 4;
  int32 vector_count = 5;
  map<string, string> metadata = 6;
}

// 嵌入计费响应
message ConsumeEmbeddingResponse {
  int32 code = 1;
  string message = 2;
  double amount = 3;
}

// 存储计费请求
message ConsumeStorageRequest {
  string user_id = 1;
  string storage_type = 2;
  int64 size_bytes = 3;
  map<string, string> metadata = 4;
}

// 存储计费响应
message ConsumeStorageResponse {
  int32 code = 1;
  string message = 2;
  double amount = 3;
}

// 带宽计费请求
message ConsumeBandwidthRequest {
  string user_id = 1;
  string bandwidth_type = 2;
  int64 bytes = 3;
  map<string, string> metadata = 4;
}

// 带宽计费响应
message ConsumeBandwidthResponse {
  int32 code = 1;
  string message = 2;
  double amount = 3;
}

// 计费服务
service BillingService {
  // 充值
  rpc Deposit(DepositRequest) returns (DepositResponse);
  
  // 提现
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
  
  // 获取账户信息
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  
  // 获取交易记录
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
  
  // 获取用量统计
  rpc GetUsageStats(GetUsageStatsRequest) returns (GetUsageStatsResponse);
  
  // 模型调用计费
  rpc ConsumeModelCall(ConsumeModelCallRequest) returns (ConsumeModelCallResponse);
  
  // 嵌入计费
  rpc ConsumeEmbedding(ConsumeEmbeddingRequest) returns (ConsumeEmbeddingResponse);
  
  // 退款
  rpc Refund(RefundRequest) returns (RefundResponse);
  
  // 存储计费
  rpc ConsumeStorage(ConsumeStorageRequest) returns (ConsumeStorageResponse);
  
  // 带宽计费
  rpc ConsumeBandwidth(ConsumeBandwidthRequest) returns (ConsumeBandwidthResponse);
}

syntax = "proto3";

package ai.summary;

option go_package = "Logos/proto_gen/summary";

import "google/protobuf/timestamp.proto";
import "messaging/chat.proto";

message ModelConfig {
  string provider = 1;
  string model = 2;
  string api_key = 3;
  string base_url = 4;
  double temperature = 5;
}

message TodoItem {
  string id = 1;
  string content = 2;
  string assignee = 3;
  google.protobuf.Timestamp deadline = 4;
  string status = 5;
}

message ReplyCandidate {
  string id = 1;
  string content = 2;
  float confidence = 3;
  string type = 4;
}

message SummarizeMessagesRequest {
  string chat_id = 1;
  messaging.chat.ChatType chat_type = 2;
  repeated string message_ids = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  bool include_todos = 6;
  bool include_candidates = 7;
  ModelConfig model_config = 8;
  int32 message_count = 9;
}

message SummarizeMessagesResponse {
  int32 code = 1;
  string message = 2;
  string summary = 3;
  repeated TodoItem todos = 4;
  repeated ReplyCandidate reply_candidates = 5;
  repeated string key_points = 6;
  repeated string participants = 7;
}

message GenerateReplyCandidatesRequest {
  string chat_id = 1;
  messaging.chat.ChatType chat_type = 2;
  repeated string context_message_ids = 3;
  int32 candidate_count = 4;
  string tone = 5;
  ModelConfig model_config = 6;
}

message GenerateReplyCandidatesResponse {
  int32 code = 1;
  string message = 2;
  repeated ReplyCandidate candidates = 3;
}

message ExtractTodosRequest {
  string chat_id = 1;
  messaging.chat.ChatType chat_type = 2;
  repeated string message_ids = 3;
  ModelConfig model_config = 4;
  int32 message_count = 5;
}

message ExtractTodosResponse {
  int32 code = 1;
  string message = 2;
  repeated TodoItem todos = 3;
}

service SummaryService {
  rpc SummarizeMessages(SummarizeMessagesRequest) returns (SummarizeMessagesResponse);
  rpc GenerateReplyCandidates(GenerateReplyCandidatesRequest) returns (GenerateReplyCandidatesResponse);
  rpc ExtractTodos(ExtractTodosRequest) returns (ExtractTodosResponse);
}

syntax = "proto3";

package user;

option go_package = "Logos/proto_gen/user";

import "common.proto";

// 注册请求
message RegisterReq {
  string username = 1;
  string password = 2;
  optional string email = 3;
  optional string phone = 4;
}

// 登录请求
message LoginReq {
  string account = 1;
  string password = 2;
}

// 登录注册响应
message LoginRegisterResp {
  common.BaseResp base_resp = 1;
  common.User user = 2;
  string token = 3;
  int64 expire_at = 4;
}

// 用户信息请求
message UserInfoReq {
  int64 user_id = 1;
}

// 用户信息响应
message UserInfoResp {
  common.BaseResp base_resp = 1;
  common.User user = 2;
}

// 批量用户信息请求
message BatchUserInfoReq {
  repeated int64 user_ids = 1;
}

// 批量用户信息响应
message BatchUserInfoResp {
  common.BaseResp base_resp = 1;
  map<int64, common.User> users = 2;
}

// 更新用户请求
message UpdateUserReq {
  int64 user_id = 1;
  optional string email = 2;
  optional string phone = 3;
  optional string avatar = 4;
  map<string, string> preferences = 5;
  repeated string interests = 6;
  optional string old_password = 7;
  optional string new_password = 8;
}

// 检查用户名请求
message CheckUsernameReq {
  string username = 1;
}

// 检查用户名响应
message CheckUsernameResp {
  bool available = 1;
  common.BaseResp base_resp = 2;
}

// 用户统计请求
message UserStatsReq {
  int64 user_id = 1;
}

// 用户统计信息
message UserStats {
  int64 user_id = 1;
  int64 question_count = 2;
  int64 answer_count = 3;
  int64 recommendation_count = 4;
}

// 用户统计响应
message UserStatsResp {
  common.BaseResp base_resp = 1;
  UserStats stats = 2;
  int64 total_user_count = 3;
}

// 通过用户名获取用户信息请�?
message UserInfoByUsernameReq {
  string username = 1;
}

// 更新头像请求
message UpdateAvatarReq {
  int64 user_id = 1;
  bytes avatar_data = 2;
}

// 批量检查用户名请求
message BatchCheckUsernamesReq {
  repeated string usernames = 1;
}

// 批量检查用户名响应
message BatchCheckUsernamesResp {
  common.BaseResp base_resp = 1;
  map<string, bool> available_map = 2;
}

// 搜索用户请求
message SearchUsersReq {
  string keyword = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// 搜索用户响应
message SearchUsersResp {
  common.BaseResp base_resp = 1;
  repeated common.User users = 2;
  int64 total = 3;
}

// 验证令牌请求
message VerifyTokenReq {
  string token = 1;
}

// 验证令牌响应
message VerifyTokenResp {
  bool valid = 1;
}

// 用户服务接口
service UserService {
  // 注册
  rpc Register(RegisterReq) returns (LoginRegisterResp);
  // 登录
  rpc Login(LoginReq) returns (LoginRegisterResp);
  // 获取用户信息
  rpc GetUserInfo(UserInfoReq) returns (UserInfoResp);
  // 通过用户名获取用户信�?
  rpc GetUserInfoByUsername(UserInfoByUsernameReq) returns (UserInfoResp);
  // 批量获取用户信息
  rpc BatchGetUserInfo(BatchUserInfoReq) returns (BatchUserInfoResp);
  // 更新用户信息
  rpc UpdateUser(UpdateUserReq) returns (common.BaseResp);
  // 更新头像
  rpc UpdateAvatar(UpdateAvatarReq) returns (common.BaseResp);
  // 检查用户名是否可用
  rpc CheckUsername(CheckUsernameReq) returns (CheckUsernameResp);
  // 批量检查用户名是否可用
  rpc BatchCheckUsernames(BatchCheckUsernamesReq) returns (BatchCheckUsernamesResp);
  // 获取用户统计信息
  rpc GetUserStats(UserStatsReq) returns (UserStatsResp);
  // 搜索用户
  rpc SearchUsers(SearchUsersReq) returns (SearchUsersResp);
  // 验证令牌
  rpc VerifyToken(VerifyTokenReq) returns (VerifyTokenResp);
}

syntax = "proto3";

package question;

option go_package = "Logos/proto_gen/question";

import "common.proto";

// 问题请求
message QuestionReq {
  string content = 1;
  int64 user_id = 2;
  map<string, string> context = 3;
  // request_id 是调用方的幂等键（Kafka 消费路径使用 message_id）。
  // 服务端据此派生确定性的问答记录 ID：同一 request_id 重放时直接返回
  // 已落库的答案，不再调用模型。为空时保持原有行为（每次生成新记录）。
  string request_id = 4;
}

// 回答响应
message AnswerResp {
  common.BaseResp base_resp = 1;
  string answer = 2;
  double confidence = 3;
  repeated string sources = 4;
  string question_id = 5;
  int64 timestamp = 6;
  // degraded 表示这次回答没有真正经过模型（模型未配置、调用失败或超时），
  // answer 只是兜底文案。调用方不能把它当成一次成功回答：
  // Kafka 消费端会据此重试，幂等键也会允许后续成功回答覆盖这条降级记录。
  bool degraded = 7;
}

// 问答历史
message QARecord {
  string id = 1;
  string question = 2;
  string answer = 3;
  double confidence = 4;
  int64 user_id = 5;
  int64 timestamp = 6;
  optional string feedback = 7;
  optional int32 rating = 8;
  // degraded 为 true 的历史记录仍是兜底文案，前端可以提示用户重试。
  bool degraded = 9;
}

// 历史记录请求
message HistoryReq {
  int64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// 历史记录响应
message HistoryResp {
  common.BaseResp base_resp = 1;
  repeated QARecord records = 2;
  int64 total = 3;
}

// 反馈请求
message FeedbackReq {
  string question_id = 1;
  string feedback = 2;
  optional int32 rating = 3;
}

// 批量问题请求
message BatchQuestionReq {
  repeated string questions = 1;
  int64 user_id = 2;
}

// 批量回答响应
message BatchAnswerResp {
  common.BaseResp base_resp = 1;
  map<string, string> answers = 2;
}

// 获取推荐问题请求
message GetRecommendedQuestionsReq {
  int64 user_id = 1;
}

// 问答服务接口
service QAService {
  // 处理单个问题
  rpc AskQuestion(QuestionReq) returns (AnswerResp);

  // 批量处理问题
  rpc BatchAskQuestions(BatchQuestionReq) returns (BatchAnswerResp);

  // 获取问答历史
  rpc GetHistory(HistoryReq) returns (HistoryResp);

  // 提交反馈
  rpc SubmitFeedback(FeedbackReq) returns (common.BaseResp);

  // 获取推荐问题
  rpc GetRecommendedQuestions(GetRecommendedQuestionsReq) returns (common.BaseResp);
}
